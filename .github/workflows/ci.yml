name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:coverage

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @blindsignal/browser-demo exec playwright install --with-deps chromium firefox
      # Docker on the runner starts the compose.yaml Coturn for the relay tests.
      - run: pnpm test:browser
        env:
          BLINDSIGNAL_TEST_TURN: '1'

  # The adapters against their real services, from compose.yaml (ADR 0019).
  adapters:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: docker compose --profile postgres --profile valkey up --wait postgres valkey
      - run: pnpm --filter @blindsignal/storage-postgresql migrate
        env:
          BLINDSIGNAL_DATABASE_URL: postgres://blindsignal:blindsignal-test-password-never-in-production@127.0.0.1:5432/blindsignal
      - run: pnpm exec vitest run adapters/storage/postgresql adapters/coordination/redis
        env:
          BLINDSIGNAL_TEST_POSTGRES_URL: postgres://blindsignal:blindsignal-test-password-never-in-production@127.0.0.1:5432/blindsignal
          BLINDSIGNAL_TEST_REDIS_URL: redis://127.0.0.1:6379
