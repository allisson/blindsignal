name: CI

on:
  pull_request:
  push:
    branches: [main]

# Actions are pinned by commit, and Dependabot proposes their updates (ADR 0048).
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Known advisories in what the packages ship (ADR 0048).
      - run: pnpm audit --prod
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:coverage

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @blindsignal/browser-demo exec playwright install --with-deps chromium firefox webkit
      # Docker on the runner starts the compose.yaml Coturn for the relay tests.
      - run: pnpm test:browser
        env:
          BLINDSIGNAL_TEST_TURN: '1'

  # The adapters against their real services, from compose.yaml (ADR 0019).
  adapters:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: docker compose --profile postgres --profile valkey up --wait postgres pgbouncer valkey
      - run: pnpm --filter @blindsignal/storage-postgresql migrate
        env:
          BLINDSIGNAL_DATABASE_URL: postgres://blindsignal:blindsignal-test-password-never-in-production@127.0.0.1:5432/blindsignal
      - run: pnpm exec vitest run adapters/storage/postgresql adapters/coordination/redis apps/server/src/server.test.ts
        env:
          BLINDSIGNAL_TEST_POSTGRES_URL: postgres://blindsignal:blindsignal-test-password-never-in-production@127.0.0.1:5432/blindsignal
          BLINDSIGNAL_TEST_REDIS_URL: redis://127.0.0.1:6379
      # Again through a transaction-mode pooler, as behind a managed provider (ADR 0027).
      - run: pnpm exec vitest run adapters/storage/postgresql
        env:
          BLINDSIGNAL_TEST_POSTGRES_URL: postgres://blindsignal:blindsignal-test-password-never-in-production@127.0.0.1:6432/blindsignal

  # The production image as a deployment runs it, and the self-hosted setup that builds it (ADR 0033).
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build --tag blindsignal:ci .
      - run: .github/scripts/image-smoke.sh blindsignal:ci
      # The example .env with the one value docs/self-hosted.md asks to generate.
      - run: |
          sed 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci/' .env.example >.env
          docker compose config --quiet
        working-directory: examples/self-hosted
