# Local development: the dev issuer is trusted, so never expose this setup.
services:
  server:
    build: .
    environment:
      BLINDSIGNAL_ENV: development
      BLINDSIGNAL_REGISTRY_PATH: /etc/blindsignal/registry.json
      # Inside the container; the host only reaches it through the loopback port below.
      BLINDSIGNAL_ADMIN_HOST: 0.0.0.0
    volumes:
      - ./examples/registry.dev.json:/etc/blindsignal/registry.json:ro
    ports:
      - 127.0.0.1:8080:8080
      - 127.0.0.1:9090:9090

  # A TURN server for the relay tests (ADR 0017): `docker compose --profile turn up coturn`. Its
  # secret is public in this repository, like the dev issuer's key. TLS uses a self-signed
  # certificate made at startup, so no private key lives in the repository.
  coturn:
    image: coturn/coturn:4.18.0
    profiles: [turn]
    entrypoint: [sh, -c]
    command:
      - >-
        openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:prime256v1 -nodes -days 1
        -subj /CN=localhost -addext subjectAltName=DNS:localhost,IP:127.0.0.1
        -keyout /tmp/key.pem -out /tmp/cert.pem 2>/dev/null &&
        exec turnserver --use-auth-secret
        --static-auth-secret=blindsignal-test-turn-secret-never-in-production
        --realm=blindsignal.test --listening-port=3478 --tls-listening-port=5349
        --cert=/tmp/cert.pem --pkey=/tmp/key.pem --no-cli --log-file=stdout
    ports:
      - 127.0.0.1:3478:3478/udp
      - 127.0.0.1:3478:3478/tcp
      - 127.0.0.1:5349:5349/tcp

  # PostgreSQL for the storage adapter's tests (ADR 0019): `docker compose --profile postgres up
  # --wait postgres`, then BLINDSIGNAL_TEST_POSTGRES_URL=postgres://blindsignal:blindsignal-test-password-never-in-production@127.0.0.1:5432/blindsignal.
  # Its password is public in this repository, like the dev issuer's key.
  postgres:
    image: postgres:18.6-alpine
    profiles: [postgres]
    environment:
      POSTGRES_USER: blindsignal
      POSTGRES_PASSWORD: blindsignal-test-password-never-in-production
      POSTGRES_DB: blindsignal
    healthcheck:
      test: [CMD, pg_isready, -U, blindsignal, -d, blindsignal]
      interval: 2s
      retries: 15
    ports:
      - 127.0.0.1:5432:5432

  # PgBouncer in transaction mode in front of that PostgreSQL, standing for a managed provider's
  # pooler, such as Supabase's (ADR 0027): `docker compose --profile postgres up --wait pgbouncer`,
  # then the same URL on port 6432. Prepared statements are off, as behind the strictest poolers.
  pgbouncer:
    image: edoburu/pgbouncer:v1.26.1-p0
    profiles: [postgres]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://blindsignal:blindsignal-test-password-never-in-production@postgres:5432/blindsignal
      POOL_MODE: transaction
      AUTH_TYPE: scram-sha-256
      MAX_PREPARED_STATEMENTS: '0'
    healthcheck:
      test: [CMD, pg_isready, -h, 127.0.0.1, -p, '5432']
      interval: 2s
      retries: 15
    ports:
      - 127.0.0.1:6432:5432

  # Valkey for the coordination adapter's tests (ADR 0019): `docker compose --profile valkey up
  # --wait valkey`, then BLINDSIGNAL_TEST_REDIS_URL=redis://127.0.0.1:6379. No password: it listens
  # on loopback only, and holds nothing but test state.
  valkey:
    image: valkey/valkey:9.1.3-alpine
    profiles: [valkey]
    healthcheck:
      test: [CMD, valkey-cli, ping]
      interval: 2s
      retries: 15
    ports:
      - 127.0.0.1:6379:6379
