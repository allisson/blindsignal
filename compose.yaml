# Local development: the dev issuer is trusted, so never expose this setup.
services:
  server:
    build: .
    environment:
      BLINDSIGNAL_ENV: development
      BLINDSIGNAL_REGISTRY_PATH: /etc/blindsignal/registry.json
      # Inside the container; the host only reaches it through the loopback port below.
      BLINDSIGNAL_ADMIN_HOST: 0.0.0.0
    volumes:
      - ./examples/registry.dev.json:/etc/blindsignal/registry.json:ro
    ports:
      - 127.0.0.1:8080:8080
      - 127.0.0.1:9090:9090

  # A TURN server for the relay tests (ADR 0017): `docker compose --profile turn up coturn`. Its
  # secret is public in this repository, like the dev issuer's key.
  coturn:
    image: coturn/coturn:4.18.0
    profiles: [turn]
    command:
      - --use-auth-secret
      - --static-auth-secret=blindsignal-test-turn-secret-never-in-production
      - --realm=blindsignal.test
      - --listening-port=3478
      - --no-tls
      - --no-cli
      - --log-file=stdout
    ports:
      - 127.0.0.1:3478:3478/udp
      - 127.0.0.1:3478:3478/tcp
