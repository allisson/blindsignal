# BlindSignal on one host (ADR 0032): Caddy terminates TLS in front of one server instance, which
# keeps devices and the registry in PostgreSQL. Follow docs/self-hosted.md: fill in .env and
# registry.json in this directory, then `docker compose up -d --build`.
services:
  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    environment:
      BLINDSIGNAL_DOMAIN: ${BLINDSIGNAL_DOMAIN:?set BLINDSIGNAL_DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    ports:
      - ${BLINDSIGNAL_HTTP_PORT:-80}:80
      - ${BLINDSIGNAL_HTTPS_PORT:-443}:443
    networks:
      edge:
        # The only address the server trusts for X-Forwarded-For.
        ipv4_address: 172.30.0.10
    depends_on:
      server:
        condition: service_healthy

  server:
    build:
      context: ../..
    image: blindsignal:local
    restart: unless-stopped
    # Every BLINDSIGNAL_* variable set in .env reaches the server (apps/server/README.md).
    env_file: .env
    # It writes nothing to disk and needs no capability (ADR 0033).
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      BLINDSIGNAL_REGISTRY_PATH: /etc/blindsignal/registry.json
      BLINDSIGNAL_DATABASE_URL: postgres://blindsignal:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/blindsignal
      BLINDSIGNAL_TRUSTED_PROXIES: 172.30.0.10
      # Inside the container; the host reaches /metrics only through the loopback port below.
      BLINDSIGNAL_ADMIN_HOST: 0.0.0.0
    volumes:
      - ./registry.json:/etc/blindsignal/registry.json:ro
    ports:
      - 127.0.0.1:${BLINDSIGNAL_METRICS_PORT:-9090}:9090
    networks: [edge, data]
    # Above BLINDSIGNAL_SHUTDOWN_TIMEOUT_SECONDS (default 8), so the server exits on its own (ADR 0031).
    stop_grace_period: 10s
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Applies the migrations before every start of the server (ADR 0019), then exits.
  migrate:
    image: blindsignal:local
    build:
      context: ../..
    command: [node, adapters/storage/postgresql/src/migrate-command.ts]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      BLINDSIGNAL_DATABASE_URL: postgres://blindsignal:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/blindsignal
    networks: [data]
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: blindsignal
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: blindsignal
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: [CMD, pg_isready, -U, blindsignal, -d, blindsignal]
      interval: 2s
      retries: 15
    networks: [data]

  # Optional TURN relay on this host (docs/vps.md, ADR 0036): `docker compose --profile turn up -d`.
  # The host's network, since the relay needs a range of UDP ports; turns: uses Caddy's certificate
  # on 5349, as Caddy holds 443.
  coturn:
    image: coturn/coturn:4.18.0
    profiles: [turn]
    restart: unless-stopped
    network_mode: host
    # Root, with no capability, only to read the certificate Caddy keeps as root's, mode 600.
    user: '0'
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    # The image's turnserver carries this file capability, and exec fails without it.
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    environment:
      BLINDSIGNAL_DOMAIN: ${BLINDSIGNAL_DOMAIN}
      BLINDSIGNAL_TURN_SECRET: ${BLINDSIGNAL_TURN_SECRET:-}
    volumes:
      - ./turnserver.conf:/etc/coturn/turnserver.conf:ro
      - caddy-data:/caddy:ro
    # The secret goes into a file, never onto the command line, where the process list shows it.
    entrypoint: [sh, -c]
    command:
      - >-
        [ -n "$$BLINDSIGNAL_TURN_SECRET" ] || { echo 'set BLINDSIGNAL_TURN_SECRET in .env'; exit 1; };
        cert=$$(find /caddy -name "$$BLINDSIGNAL_DOMAIN.crt" | head -1);
        [ -n "$$cert" ] || { echo 'waiting for the certificate from Caddy'; sleep 10; exit 1; };
        umask 077 && {
        cat /etc/coturn/turnserver.conf;
        echo "static-auth-secret=$$BLINDSIGNAL_TURN_SECRET";
        echo "realm=$$BLINDSIGNAL_DOMAIN";
        echo "cert=$$cert";
        echo "pkey=$${cert%.crt}.key"; } >/tmp/turnserver.conf &&
        exec turnserver -c /tmp/turnserver.conf
    depends_on: [caddy]

networks:
  edge:
    ipam:
      config:
        # Containers get addresses from the upper half, so Caddy's fixed one never collides.
        - subnet: 172.30.0.0/24
          ip_range: 172.30.0.128/25
  # No route out and no published port: only the server and the migration reach PostgreSQL.
  data:
    internal: true

volumes:
  caddy-data:
  postgres-data:
