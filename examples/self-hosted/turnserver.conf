# Coturn on the signaling host (docs/vps.md, ADR 0036). compose.yaml adds the secret, the realm,
# and Caddy's certificate at startup; the rest follows docs/turn-operations.md.
use-auth-secret
fingerprint
listening-port=3478
tls-listening-port=5349
min-port=49152
max-port=65535
no-multicast-peers
log-file=stdout
# Behind NAT, as on AWS or Google Cloud: the public address, then the private one.
# external-ip=203.0.113.10/10.0.0.10

# Peers the relay never reaches: this host, its networks, and the cloud metadata address.
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=::ffff:0:0-::ffff:ffff:ffff
denied-peer-ip=64:ff9b::-64:ff9b::ffff:ffff

# Size these for the relayed sessions you expect (docs/turn-operations.md, Limits); Coturn's
# default is no limit.
# user-quota=
# total-quota=
# max-bps=
